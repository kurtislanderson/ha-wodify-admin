refresh_now:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: wodify

set_filter:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: wodify
    locations:
      required: true
      selector:
        object:
    programs:
      required: true
      selector:
        object:

set_event_timing:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: wodify
    before_class_minutes:
      required: false
      default: 15
      selector:
        number:
          min: 5
          max: 60
          unit_of_measurement: minutes
    after_block_minutes:
      required: false
      default: 15
      selector:
        number:
          min: 5
          max: 60
          unit_of_measurement: minutes

send_email:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: wodify
    to_email:
      required: true
      example: member@example.com
      selector:
        text:
    subject:
      required: true
      example: Schedule change
      selector:
        text:
    body:
      required: true
      example: Tomorrow's 6am class is moved to 7am.
      selector:
        text:
          multiline: true
    from_email:
      required: false
      example: staff@example.com
      selector:
        text:
    cc:
      required: false
      example: '["coach@example.com"]'
      selector:
        text:
          multiple: true
    bcc:
      required: false
      example: '["owner@example.com"]'
      selector:
        text:
          multiple: true
